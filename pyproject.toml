[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-mermaidjs"
version = "0.1.0"
description = "Reflex custom component for mermaid-js: flowcharts, sequence, class, ER, gantt, mindmap and 30+ diagram types from text, with pan & zoom, themes, export and events"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = ["reflex", "reflex-custom-components", "mermaid", "mermaid-js", "diagrams", "flowchart", "uml"]
dependencies = ["reflex>=0.9.11"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-mermaidjs"
Source = "https://github.com/ecrespo/reflex-mermaidjs"
Issues = "https://github.com/ecrespo/reflex-mermaidjs/issues"

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_mermaidjs = ["*.jsx", "*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".web", "reflex.lock"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "BLE",  # flake8-blind-except
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF012",  # Reflex State class attrs are intentionally mutable defaults
    "RUF001",  # "Mermaid × Reflex" and "·" separators are deliberate typography
]

[tool.ruff.lint.isort]
# tomllib is stdlib on 3.11+; the py310 target alone would sort it as third-party.
extra-standard-library = ["tomllib"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.bandit]
# Tests legitimately use `assert`; B101 there is noise, not a finding.
exclude_dirs = [".venv", ".web", "tests", "build", "dist"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "build>=1.6.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
