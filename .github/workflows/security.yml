name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface without a push.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        run: uv sync --all-groups

      # Fails the job on medium-or-higher findings; the `tests` exclusion and
      # the rest of the tuning live in [tool.bandit] in pyproject.toml.
      - name: bandit
        run: uv run bandit -c pyproject.toml -r . -ll -f screen

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # Covers the Python package and the bundled React/JSX renderer, which is
      # where the XSS surface of this component actually lives.
      - name: semgrep scan
        run: >
          uvx --from semgrep semgrep scan
          --config=p/python
          --config=p/javascript
          --config=p/react
          --config=p/secrets
          --error
          --metrics=off
          --exclude=.web
          --exclude=reflex.lock
          .

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export the locked dependency set
        run: uv export --format requirements-txt --no-emit-project --all-groups -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit -r requirements-audit.txt --strict

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
