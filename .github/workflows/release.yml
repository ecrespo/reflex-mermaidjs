name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only; do not publish to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # A tag that disagrees with pyproject.toml would publish a version nobody
      # can reproduce from the tree, so refuse to build at all.
      - name: Check the tag matches the packaged version
        id: version
        run: |
          set -euo pipefail
          version=$(uv run --no-project python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaged version: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag v$tag does not match pyproject.toml version $version"
              exit 1
            fi
          fi

      - name: Run the full gate before shipping
        run: |
          uv sync --all-groups
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
          uv run bandit -c pyproject.toml -r . -ll

      - name: Build sdist + wheel
        run: uv build

      - name: Validate package metadata
        run: uvx twine check --strict dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry_run == false
    environment:
      name: pypi
      url: https://pypi.org/p/reflex-mermaidjs
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token is stored.
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: uv publish
        run: uv publish --trusted-publishing always dist/*

  github-release:
    name: Publish GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release with the built artifacts attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
